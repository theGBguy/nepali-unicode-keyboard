# Generates NepaliKeyboard.xcodeproj: `cd iosApp && xcodegen generate`.
# The generated project is committed, so building doesn't need XcodeGen; rerun it only after
# changing this file. Source folders are synced, so new Swift files need no regeneration.
name: NepaliKeyboard
options:
  bundleIdPrefix: io.github.thegbguy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  # Nepali strings live in the String Catalogs (Localizable.xcstrings) of both targets
  createIntermediateGroups: true
# Google ML Kit (handwriting) as Swift packages: Google ships it only as CocoaPods binaries, which
# this package republishes. Its device slices were checked to match Google's pod byte for byte.
packages:
  GoogleMLKit:
    url: https://github.com/d-date/google-mlkit-swiftpm
    exactVersion: 9.0.2
settings:
  base:
    DEVELOPMENT_TEAM: 2G9CN64MSN
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The shared framework is built for Apple silicon simulators only (no iosX64 target)
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  NepaliKeyboard:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: App
        type: syncedFolder
      # Settings keys and the App Group, used by both targets
      - path: Shared
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.thegbguy.nepalikeyboard
        PRODUCT_NAME: NepaliKeyboard
        INFOPLIST_KEY_CFBundleDisplayName: Nepali Unicode Keyboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPhone-only and portrait-only: without this, App Store upload rejects the build (90474)
        # because iPhone apps also run on iPad, where multitasking needs every orientation
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # No encryption beyond Apple's own HTTPS, so uploads skip the export-compliance question
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Settings live in the App Group's defaults so the keyboard reads what the app's Settings set
    entitlements:
      path: NepaliKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.thegbguy.nepalikeyboard]
    dependencies:
      - target: NepaliKeyboardExtension
        embed: true
  NepaliKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        type: syncedFolder
      - path: Shared
        type: syncedFolder
      # The same word list as Android, so both platforms always suggest the same words
      - path: ../app/src/main/assets/words_ne.tsv
        buildPhase: resources
      - path: ../app/src/main/assets/emoji.tsv
        buildPhase: resources
      # ML Kit's resource bundle, which Swift packages can't carry (same files as Google's pod)
      - path: Vendor/MLKitDigitalInkRecognition_resource.bundle
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.thegbguy.nepalikeyboard.keyboard
        PRODUCT_NAME: NepaliKeyboardExtension
        INFOPLIST_FILE: KeyboardInfo.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nepali Unicode Keyboard
        # The shared Kotlin code (KeyboardController, transliteration, layouts), built by Gradle
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # -ObjC: ML Kit registers its classes through Objective-C categories the linker would drop
        OTHER_LDFLAGS: $(inherited) -framework NepaliKeyboardShared -ObjC
    entitlements:
      path: NepaliKeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.thegbguy.nepalikeyboard]
    dependencies:
      - package: GoogleMLKit
        product: MLKitDigitalInkRecognition
      # Static, so nothing is embedded; a target of its own so it builds alongside ML Kit's packages
      - target: SharedKotlinFramework
aggregateTargets:
  # Builds the shared Kotlin framework with Gradle. Its own target with no dependencies, so Xcode
  # runs it in parallel with the ML Kit package targets instead of after them.
  SharedKotlinFramework:
    buildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          # Xcode's environment has no JAVA_HOME; Gradle needs JDK 17 or newer
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME="$(/usr/libexec/java_home -v 17 2>/dev/null || /usr/libexec/java_home)"
          fi
          # The framework is static, so nothing is embedded, but the task still asks for the path
          # an app target would embed into, which an aggregate target doesn't have
          export FRAMEWORKS_FOLDER_PATH="${FRAMEWORKS_FOLDER_PATH:-Frameworks}"
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
